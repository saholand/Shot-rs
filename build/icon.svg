<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#glow)" stroke-width="6"/>

  <!-- Eye of Ra - outer eye shape -->
  <path d="M 100 256 Q 180 160 256 160 Q 332 160 412 256 Q 332 352 256 352 Q 180 352 100 256 Z"
        fill="none" stroke="url(#glow)" stroke-width="10" stroke-linecap="round"/>

  <!-- Eye white -->
  <path d="M 120 256 Q 190 175 256 175 Q 322 175 392 256 Q 322 337 256 337 Q 190 337 120 256 Z"
        fill="rgba(255,255,255,0.08)"/>

  <!-- Iris circle -->
  <circle cx="256" cy="256" r="55" fill="url(#iris)"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="24" fill="#1a1a2e"/>

  <!-- Pupil highlight -->
  <circle cx="246" cy="246" r="8" fill="rgba(255,255,255,0.6)"/>

  <!-- Ra tear drop (the distinctive feature of Eye of Ra) -->
  <path d="M 256 312 Q 250 360 240 400 Q 235 420 250 415 Q 262 412 256 390 Q 252 370 256 312"
        fill="url(#glow)" stroke="none"/>

  <!-- Ra spiral / extension to the right -->
  <path d="M 392 256 Q 420 256 435 272 Q 450 290 440 310 Q 432 325 415 320"
        fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>

  <!-- Upper eyelid accent line -->
  <path d="M 130 240 Q 190 170 256 170 Q 322 170 382 240"
        fill="none" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Subtle glow around iris -->
  <circle cx="256" cy="256" r="65" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="3"/>
</svg>
